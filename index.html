<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMMUNICARE — Communication Board</title>
<meta name="description" content="Accessible AAC communication board with phrase strip, next-word prediction and bilingual Tagalog/English vocabulary.">
<meta name="theme-color" content="#ffffff">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><path d='M9 12h14M9 16h14M9 20h9' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/board.css">
<link rel="stylesheet" href="assets/css/onboarding.css">
</head>

<body data-age="youth">

<div id="onboarding-root"></div>

<a href="#board-grid" class="u-sr">Skip to symbol grid</a>

<!-- ══════════════════════════════════════════════════ Top navigation ══ -->
<header class="topbar">
  <div class="topbar__in">

    <a class="brand" href="index.html" aria-label="COMMUNICARE home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-5 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m12 14-3.2-3A2 2 0 0 1 11.6 8l.4.5.4-.5a2 2 0 0 1 2.8 3Z"/>
        </svg>
      </span>
      <span class="brand__name">Communicare</span>
    </a>

    <span class="topbar__spacer"></span>

    <div class="topbar__tools">
      <!-- Global control: active location / routine context -->
      <button class="ctx" id="btn-ctx" title="Change location context">
        <span id="ctx-ico"></span>
        <span id="ctx-label">School</span>
        <span class="ctx__meta" id="ctx-meta">Morning</span>
      </button>

      <!-- Global control: Tagalog / English toggle -->
      <div class="segment" role="group" aria-label="Language">
        <button class="segment__btn" id="lang-en" aria-pressed="true" lang="en">English</button>
        <button class="segment__btn" id="lang-tl" aria-pressed="false" lang="fil">Tagalog</button>
      </div>

      <!-- Hold for Settings entry, gated by PIN -->
      <button class="lockbtn" id="btn-lock" title="Press and hold for Hold for Settings" aria-label="Press and hold for Hold for Settings"></button>
    </div>

  </div>
</header>

<!-- ═══════════════════════════════════════════════════════ Board ══ -->
<div class="shell">
  <div class="board">

    <!-- ─────────────────────────────────── Category rail ── -->
    <nav class="rail" id="rail" aria-label="Vocabulary categories"></nav>

    <!-- ─────────────────────────────────── Main column ── -->
    <main class="main">

      <!-- Action toolbar -->
      <!-- Visual phrase strip -->
      <section class="strip" aria-label="Phrase builder">
        <div class="strip__slots" id="strip-slots" aria-live="polite"></div>
        <div class="toolbar">
          <select id="draw-match" class="draw-match-select" aria-label="Select the symbol that best matches your drawing" hidden></select>
          <button class="btn" id="btn-back" aria-label="Delete — remove last symbol"></button>
          <button class="btn" id="btn-clear" aria-label="Clear the whole phrase"></button>
          <button class="btn btn--success" id="btn-speak" aria-label="Speak the phrase aloud"></button>
        </div>
      </section>

      <section class="quick-tools" id="quick-tools" aria-label="Communication mode">
        <div class="mode-switch" id="mode-switch" role="group" aria-label="Choose communication mode">
          <button class="mode-switch__btn is-active" type="button" data-mode="board" aria-pressed="true">Board</button>
          <button class="mode-switch__btn" type="button" data-mode="keyboard" aria-pressed="false">Type a Message</button>
          <button class="mode-switch__btn" type="button" data-mode="drawing" aria-pressed="false">Draw a Symbol</button>
        </div>
        <div id="sentence-tool"><div class="quick-tools__head"><h2>Quick phrases</h2><span>Tap to speak</span></div>
        <div id="quick-phrases" class="quick-phrases"></div></div>
        <section class="tool-panel" id="keyboard-tool" aria-labelledby="keyboard-title" hidden>
          <h2 class="u-sr" id="keyboard-title">Type a message</h2>
          <div class="tool-panel__body"><label class="u-sr" for="type-message">Message to speak</label>
            <textarea id="type-message" rows="2" inputmode="none" placeholder="Type a message"></textarea>
            <div class="virtual-keyboard" id="virtual-keyboard" aria-label="On-screen keyboard"></div>
          </div>
        </section>
        <section class="tool-panel" id="drawing-tool" hidden>
          <h2 class="u-sr" id="drawing-title">Draw a symbol</h2>
          <div class="tool-panel__body draw-tools"><canvas id="draw-pad" width="640" height="320" aria-label="Drawing pad"></canvas>
            <p class="field__hint">Draw a cue, select the symbol that matches it, then review and speak the word.</p>
            <div id="draw-preview" class="draw-preview" aria-live="polite" aria-atomic="true"></div>
          </div>
        </section>
      </section>

      <!-- Dynamic Top-5 prediction bar — deliberately tinted so it never
           reads as part of the main vocabulary grid -->
      <section class="predict" aria-label="Suggested next words">
        <div class="predict__head">
          <span id="predict-ico" aria-hidden="true"></span>
          <span class="u-eyebrow" id="predict-label">Suggestions</span>
        </div>
        <div class="predict__row" id="predict-row"></div>
      </section>

      <!-- Main vocabulary board -->
      <div class="gridwrap">
        <h2 class="u-sr">Symbol grid</h2>
        <div class="board__grid" id="board-grid"></div>
      </div>

    </main>
  </div>
  <p class="arasaac-credit">Pictograms by Sergio Palao, property of the Government of Aragón · Source: <a href="https://arasaac.org" target="_blank" rel="noopener">ARASAAC</a> · <a href="https://arasaac.org/terms-of-use" target="_blank" rel="noopener">CC BY-NC-SA</a></p>
</div>

<!-- ═══════════════════════════════════════════════════ Overlays ══ -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>
<div id="ctx-root"></div>
<div id="pin-root"></div>

<script src="assets/js/symbols.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/predict.js"></script>
<script src="assets/js/pin.js"></script>
<script src="assets/js/onboarding.js"></script>
<script src="assets/js/board.js"></script>
<script>
  /* Inline the icon markup that lives in JS so there is no render flash. */
  document.getElementById('ctx-ico').innerHTML  = CC.UI.pin;
  document.getElementById('predict-ico').innerHTML = CC.UI.spark;
  document.getElementById('btn-back').innerHTML  = CC.UI.Delete + '<span>Delete</span>';
  document.getElementById('btn-clear').innerHTML = CC.UI.trash + '<span>Clear</span>';
  document.getElementById('btn-speak').innerHTML = CC.UI.speaker + '<span>Speak</span>';
  document.getElementById('btn-lock').innerHTML = CC.UI.lock + '<span id="lock-label">Hold for Settings</span>';
  /* Start the six-step entry flow on every page load, including refreshes.
     Saved profile and board preferences are prefilled by Onboarding.init(). */
  CC.Onboarding.init(function () { CC.Board.init(); });
</script>
</body>
</html>
